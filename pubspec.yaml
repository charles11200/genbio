name: genbio
description: "Gen Bio Offline Reviewing App - Capstone Project"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Local database - pure offline persistence, no server
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2

  # Let the admin pick a PDF/PPTX/notes file from the device - offline file
  # picker, does not require internet or any cloud storage account
  file_picker: ^8.1.2

  # Offline PDF text extraction (pure Dart/Flutter, no native binary needed)
  # Free Syncfusion Community License covers individuals & small teams -
  # check https://www.syncfusion.com/sales/communitylicense before shipping
  # if your school/org grows past the free-tier limits.
  syncfusion_flutter_pdf: ^25.1.35

  # A .pptx is a zip of XML files - these two pure-Dart packages let us
  # unzip and parse it directly, no Apache POI / cloud conversion needed.
  archive: ^3.4.10
  xml: ^6.5.0

  # On-device (offline, no network) inference for the Biology-term
  # embedding model used to rank distractor relevance - see
  # lib/services/term_embedding_service.dart. Official TensorFlow-managed
  # Flutter binding, not a third-party wrapper.
  tflite_flutter: ^0.12.1

  # OCR fallback for scanned/photographed PDFs (e.g. phone scanner apps
  # like TapScanner) that have no digital text layer at all - Syncfusion's
  # PdfTextExtractor only reads existing text layers, it can't read text
  # baked into an image. pdfx rasterizes each low-text page to a bitmap
  # (Android's native PdfRenderer, offline); flutter_tesseract_ocr then
  # runs Tesseract against that bitmap using the bundled eng.traineddata
  # below - fully on-device, no network call, no runtime download. See
  # lib/services/pdf_extractor.dart.
  pdfx: ^2.11.0
  # Vendored locally, not pulled from pub.dev - the published package's
  # Android Gradle config is broken on current tooling. See
  # third_party/flutter_tesseract_ocr/README.md for exactly what was wrong
  # and what was changed (one file, the rest is unmodified upstream code).
  flutter_tesseract_ocr:
    path: third_party/flutter_tesseract_ocr

  # Short local SFX (round start / win / lose) - see
  # lib/services/sound_service.dart. Plays bundled assets only, never a
  # network URL, same offline-only rule as everything else in this app.
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Runs as a real app process on-device, unlike flutter_test's host-side
  # runner - needed to actually exercise tflite_flutter (native plugin
  # loading isn't available in a plain `flutter test` run).
  integration_test:
    sdk: flutter
  # Dev-only tool that regenerates android/.../mipmap-*/ic_launcher.png at
  # every required density from one source image - not a runtime
  # dependency, doesn't touch the shipped app's offline behavior.
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/image.png
    - assets/models/biology_term_embedder.tflite
    - assets/models/biology_vocab.txt
    - assets/sounds/start.mp3
    - assets/sounds/win.wav
    - assets/sounds/lose.mp3
    - assets/sounds/bgm.mp3
    - assets/tessdata/
    - assets/tessdata_config.json

# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  image_path: assets/image.png