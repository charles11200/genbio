org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# tflite_flutter (0.12.1) doesn't pin its own Java/Kotlin compile target, so
# it lands on a different one than this project's explicit Java 17 and hard-
# fails the build with "Inconsistent JVM-target compatibility detected".
# Trying to force it from build.gradle.kts fights AGP/Kotlin's own property-
# finalization timing (hits "has been finalized" errors either way), so use
# Kotlin's own documented escape hatch for this exact situation instead -
# downgrades the mismatch to a warning rather than a hard failure, which is
# safe here since it's a same-family bytecode target gap (11 vs 17), not a
# real incompatibility.
kotlin.jvm.target.validation.mode=warning
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
